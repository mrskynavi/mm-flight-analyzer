name: Build

# Voller Build mit Release, nur auf main. Zum Ausprobieren vorher: Workflow „Mac-Testbuild“ (mac-test.yml).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test

  build:
    needs: test
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: MM-Flight-Analyzer-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  # Handbuch als PDF: Screenshots, Version und Changelog kommen jedes Mal frisch aus dem Repository
  handbuch:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-dejavu-core
      - run: npm run handbuch
      - uses: actions/upload-artifact@v4
        with:
          name: MM-Flight-Analyzer-Handbuch
          path: dist/MM-Flight-Analyzer-Bedienanleitung.pdf
          if-no-files-found: error

  # Jeder Stand auf main wird als Release v<version> veröffentlicht (gleiche Version wird überschrieben)
  release:
    if: github.event_name != 'pull_request'
    needs: [build, handbuch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Release-Text: Abschnitt dieser Version aus CHANGELOG.md plus Installationshinweise
      - env: { V: "${{ steps.v.outputs.version }}" }
        run: |
          awk -v v="$V" '/^## /{p=($2==v); next} p' CHANGELOG.md > notes.md
          grep -q . notes.md || { echo "CHANGELOG.md hat keinen Abschnitt für $V"; exit 1; }
          cat >> notes.md <<EOT

          ### Installation

          - Windows: MM-Flight-Analyzer-Setup-$V.exe herunterladen und ausführen.
          - Mac: MM-Flight-Analyzer-$V.dmg öffnen und die App in „Programme“ ziehen. Die App ist nicht signiert: beim ersten Start unter Systemeinstellungen → Datenschutz & Sicherheit „Dennoch öffnen“ wählen.
          - Handbuch: MM-Flight-Analyzer-Bedienanleitung.pdf (Installation, alle Tabs und Knöpfe, Troubleshooting/FAQ).
          EOT
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: MM Flight Analyzer ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: out/*
          body_path: notes.md
